task: "Generate Unit Tests for C++ Source File"

instructions:
  - Output only valid C++ code using the Google Test framework.
  - Output must not contain markdown, comments, explanations, or extra text.
  - Start the file with: #include <gtest/gtest.h>
  - Automatically detect all function definitions from the input C++ source code.
  - Add forward declarations using named parameters for each function.
    - Example: int add(int a, int b);
  - For each function, write 2–3 test cases:
      - One for typical values
      - One for edge cases or invalid input (if applicable)
  - Use the format: TEST(SuiteName, TestCaseName)
  - Use appropriate Google Test macros like EXPECT_EQ, EXPECT_THROW, etc.
  - Include this line at the top if any function throws exceptions:
    - #include <stdexcept>
  - Append the following main() function to the end of the test file:

    int main(int argc, char** argv) {
        ::testing::InitGoogleTest(&argc, argv);
        return RUN_ALL_TESTS();
    }

  - Ensure the final output is clean, minimal, and valid C++ test code that compiles with Google Test.
  - Do NOT repeat or duplicate test cases.
  - Do NOT include main function from the input C++ source.

output_format: "plain_cpp"
